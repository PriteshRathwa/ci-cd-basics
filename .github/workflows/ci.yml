
name: Basic CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install HTML validator
        run: npm install --global html-validate

      - name: Validate HTML
        run: html-validate index.html

      - name: Check HTML file
        run: test -f index.html

      - name: Run content tests
        run: bash test.sh

      - name: Build Docker image
        run: docker build -t ci-basics:test .

