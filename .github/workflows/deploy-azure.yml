
name: Deploy to Azure VM

on:
  workflow_run:
    workflows: ["Docker Image Publish"]
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Capture previous image
        id: previous
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$AZURE_VM_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$AZURE_VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key
          chmod 644 ~/.ssh/known_hosts

          PREVIOUS_IMAGE=$(ssh -i ~/.ssh/deploy_key \
            -p "$AZURE_VM_PORT" \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            "$AZURE_VM_USER@$AZURE_VM_HOST" \
            "sudo docker inspect ci-basics --format '{{.Image}}' 2>/dev/null || true")

          echo "previous_image=$PREVIOUS_IMAGE" >> "$GITHUB_OUTPUT"
          echo "Previous image: $PREVIOUS_IMAGE"

      - name: Deploy to Azure VM
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
          IMAGE_REF: ghcr.io/priteshrathwa/ci-basics:${{ github.event.workflow_run.head_sha }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$AZURE_VM_PORT" \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            "$AZURE_VM_USER@$AZURE_VM_HOST" \
            "sudo docker pull '$IMAGE_REF' &&
             (sudo docker stop ci-basics || true) &&
             (sudo docker rm ci-basics || true) &&
             sudo docker run -d \
               --name ci-basics \
               --restart unless-stopped \
               -p 127.0.0.1:8080:80 \
               '$IMAGE_REF'"

      - name: Verify deployment
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error \
              "https://${AZURE_VM_HOST}/ci-basics/rollback-test"; then
              echo "Deployment verified successfully"
              exit 0
            fi

            echo "Website not ready yet. Retrying..."
            sleep 5
          done

          echo "Deployment verification failed"
          exit 1

      - name: Roll back to previous image
        if: failure() && steps.previous.outputs.previous_image != ''
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          AZURE_VM_USER: ${{ secrets.AZURE_VM_USER }}
          AZURE_VM_SSH_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          AZURE_VM_PORT: ${{ secrets.AZURE_VM_PORT }}
          AZURE_VM_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.previous_image }}
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "$AZURE_VM_PORT" \
            -o UserKnownHostsFile=~/.ssh/known_hosts \
            -o StrictHostKeyChecking=yes \
            "$AZURE_VM_USER@$AZURE_VM_HOST" \
            "sudo docker image inspect '$PREVIOUS_IMAGE' >/dev/null &&
             (sudo docker stop ci-basics || true) &&
             (sudo docker rm ci-basics || true) &&
             sudo docker run -d \
               --name ci-basics \
               --restart unless-stopped \
               -p 127.0.0.1:8080:80 \
               '$PREVIOUS_IMAGE'"

      - name: Verify rollback
        if: failure() && steps.previous.outputs.previous_image != ''
        env:
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error \
              "https://${AZURE_VM_HOST}/ci-basics/"; then
              echo "Rollback verified"
              exit 0
            fi

            echo "Rollback website not ready yet. Retrying..."
            sleep 5
          done

          echo "Rollback verification failed"
          exit 1
